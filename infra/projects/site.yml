# Project: velkin.com website backend (API + admin panel) — subdomains api.* and admin.*
x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: /velkin/${HOSTNAME_TAG:-prod}
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  site-api:
    image: ${REGISTRY:-ghcr.io/velkin}/velkin-api:${SITE_API_TAG:-latest}
    restart: unless-stopped
    env_file: [./env/site-api.env]
    environment:
      DATABASE_URL: postgresql://velkin_site:${SITE_DB_PASSWORD}@postgres:5432/velkin_site?schema=public&connection_limit=10
      REDIS_URL: redis://:${SITE_REDIS_PASSWORD}@site-redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      site-redis: { condition: service_healthy }
    networks: [edge, site]
    deploy:
      resources: { limits: { memory: 512m } }
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=velkin-edge
      - traefik.http.routers.site-api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.site-api.entrypoints=websecure
      - traefik.http.routers.site-api.middlewares=secure-headers@file,compress@file
      - traefik.http.services.site-api.loadbalancer.server.port=4000
      - traefik.http.services.site-api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.site-api.loadbalancer.healthcheck.interval=5s

  site-admin:
    image: ${REGISTRY:-ghcr.io/velkin}/velkin-admin:${SITE_ADMIN_TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    deploy:
      resources: { limits: { memory: 384m } }
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=velkin-edge
      - traefik.http.routers.site-admin.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.site-admin.entrypoints=websecure
      # Optional extra wall in front of the admin (Cloudflare Access recommended, see README)
      - traefik.http.routers.site-admin.middlewares=secure-headers@file,compress@file
      - traefik.http.services.site-admin.loadbalancer.server.port=3001

  site-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SITE_REDIS_PASSWORD}", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    networks: [site]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${SITE_REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
    environment:
      SITE_REDIS_PASSWORD: ${SITE_REDIS_PASSWORD}

  postgres:
    networks: [site]

networks:
  site:
    name: velkin-site
    internal: false # API needs outbound internet (S3, email, Turnstile)
