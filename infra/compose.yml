# ─────────────────────────────────────────────────────────────────────────────
# Velkine — shared core for ALL Velkine backends on one EC2 instance.
# Projects live in infra/projects/*.yml and are merged via COMPOSE_FILE (see .env).
# Add a project: copy projects/_template.yml → projects/<name>.yml, append it to
# COMPOSE_FILE, `docker compose up -d`. DNS: the proxied wildcard *.velkine.com
# already points here, so no new record is needed.
# ─────────────────────────────────────────────────────────────────────────────
name: velkin

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: /velkin/${HOSTNAME_TAG:-prod}
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    # Static config as CLI flags (Traefik reads ONE static source; flags let Compose interpolate .env)
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.names.Cf-Ipcountry=keep
      - --accesslog.fields.headers.names.Cf-Ray=keep
      - --accesslog.fields.headers.names.Authorization=drop
      - --accesslog.fields.headers.names.Cookie=drop
      - --ping=true
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=velkin-edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=60s
      # Trust X-Forwarded-* only from Cloudflare (https://www.cloudflare.com/ips/)
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      # One wildcard certificate (DNS-01 via Cloudflare) for every subdomain
      - --entrypoints.websecure.http.tls.certResolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --certificatesresolvers.cf.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cf.acme.storage=/acme/acme.json
      - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # "db:user:password,db2:user2:password2" — one database + one role per project
      PROJECT_DATABASES: ${PROJECT_DATABASES}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=500", "-c", "timezone=UTC"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Each project file adds its own private network to this list.
    networks: [db-admin]
    shm_size: 256mb
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    name: velkin-edge
  db-admin:
    name: velkin-db-admin
    internal: true

volumes:
  traefik-acme:
  pg-data:
