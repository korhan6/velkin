# Local development dependencies:  docker compose -f infra/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velkin_site
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: velkin_site
      TZ: UTC
    ports: ["5432:5432"]
    volumes: [pg-dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "change-me"]
    ports: ["6379:6379"]
volumes:
  pg-dev:
